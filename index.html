<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADT Management System - Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="gateway-body">

  <!-- Solution Gateway Content (Left-aligned, Permanent UP, Interim DOWN) -->
  <main class="gateway-container">
    <div class="solution-cards-wrapper">
      
      <!-- Permanent Solution Button (UP) -->
      <a href="home.html" class="solution-btn-wrap" aria-label="Open Permanent Solution">
        <div class="solution-btn permanent-btn">
          <div class="btn-flare" aria-hidden="true"></div>
          <div class="btn-inner">
            <div class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </div>
            <div class="btn-divider" aria-hidden="true"></div>
            <span class="btn-text">Permanent Solution</span>
            <div class="btn-arrow-badge" aria-hidden="true">
              <i class="fa-solid fa-angles-right"></i>
            </div>
          </div>
        </div>
      </a>

      <!-- Interim Solution Button (DOWN) -->
      <a href="interim.html" class="solution-btn-wrap" aria-label="Open Interim Solution">
        <div class="solution-btn interim-btn">
          <div class="btn-flare" aria-hidden="true"></div>
          <div class="btn-inner">
            <div class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M12 7v5l3 3"/>
              </svg>
            </div>
            <div class="btn-divider" aria-hidden="true"></div>
            <span class="btn-text">Interim Solution</span>
            <div class="btn-arrow-badge" aria-hidden="true">
              <i class="fa-solid fa-angles-right"></i>
            </div>
          </div>
        </div>
      </a>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/script.js"></script>
</body>
</html>
